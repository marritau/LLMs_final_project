[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-hallucination-detection"
version = "0.1.0"
description = "Span-level hallucination detection for tool-calling dialogues."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Skoltech NLP final project" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "datasets>=2.18",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
models = [
    "torch>=2.1",
    "transformers>=4.44",
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "lettucedetect>=0.1.7",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tool-hallu = "tool_hallucination_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

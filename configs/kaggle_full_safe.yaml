name: kaggle_full_safe
quick: false

dataset:
  seed: 42
  max_base_records: 1000
  include_clean_hard: true
  cache_dir: /kaggle/working/artifacts/kaggle_full/dataset
  allow_synthetic_fallback: false

training:
  model_name: answerdotai/ModernBERT-base
  output_dir: /kaggle/working/artifacts/kaggle_full/modernbert-token-classifier
  epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 2
  max_length: 2048
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  fp16: true
  early_stopping_patience: 2
  gradient_checkpointing: true
  use_class_weights: true
  strict: false

evaluation:
  include_attention_lookback: true
  attention_lookback_model_name: distilgpt2
  attention_lookback_train_limit: 240
  attention_lookback_max_length: 384
  attention_lookback_max_answer_tokens: 96
  include_lettucedetect_fallback: false
  require_real_lettucedetect: false
  lettuce_model_path: KRLabsOrg/lettucedect-base-modernbert-en-v1
  require_attention_lookback: false
  threshold_metric: macro_f1
  score_aggregator: topk_mean_prob_3

outputs:
  artifacts_dir: /kaggle/working/artifacts/kaggle_full
  results_dir: /kaggle/working/results/kaggle_full_safe
